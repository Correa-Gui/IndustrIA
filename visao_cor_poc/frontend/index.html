function icumsaStyle(v){
  if(v<=45)  return{bg:'bg-amber-50',  border:'border-amber-300', text:'text-amber-900', pill:'bg-cana-700 text-white',  label:'Branco Premium'};
  if(v<=150) return{bg:'bg-cana-50',   border:'border-cana-300',  text:'text-cana-900',  pill:'bg-cana-600 text-white',  label:'Branco Padrão'};
  if(v<=600) return{bg:'bg-orange-50', border:'border-orange-300',text:'text-orange-900',pill:'bg-orange-600 text-white',label:'VHP / Demerara'};
  return      {bg:'bg-stone-100', border:'border-stone-400', text:'text-stone-900', pill:'bg-stone-700 text-white', label:'Mascavo / Bruto'};
}
function confStyle(c){
  return c==='Alta'
    ?'bg-emerald-100 text-emerald-800 border border-emerald-200'
    :c==='Media'
    ?'bg-amber-100 text-amber-800 border border-amber-200'
    :'bg-red-100 text-red-700 border border-red-200';
}
function fmt(v,d=1){return v==null?'—':Number(v).toFixed(d)}
function fmtTime(ts){
  try{return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
  catch{return ts||'—'}
}

/* ══════════════════════════════════════════════
   COLOR SWATCH
══════════════════════════════════════════════ */
function ColorSwatch({R,G,B}){
  const r=Math.round(R||0),g=Math.round(G||0),b=Math.round(B||0);
  const hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
  const lum=0.299*r+0.587*g+0.114*b;
  const tc=lum>160?'rgba(28,18,8,.7)':'rgba(253,250,244,.85)';
  return(
    <div className="flex items-center gap-2 flex-shrink-0">
      <div className="w-10 h-10 rounded-xl border-2 border-white/80 flex-shrink-0"
        style={{
          background:`rgb(${r},${g},${b})`,
          boxShadow:`0 4px 16px rgba(${r},${g},${b},.45),0 1px 4px rgba(0,0,0,.2)`
        }}/>
      <div>
        <p style={{color:tc,fontSize:'10px',fontFamily:'JetBrains Mono,monospace',fontWeight:700,letterSpacing:'0.06em',lineHeight:1}}>{hex}</p>
        <p style={{fontSize:'9px',fontFamily:'JetBrains Mono,monospace',color:'#9ca3af',letterSpacing:'0.03em',marginTop:'3px'}}>R{r}·G{g}·B{b}</p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════

function ICUMSASpectrum({value}){

  const pct=Math.min(97,Math.max(3,(Math.min(value,MAX)/MAX)*100));
  return(
    <div className="mt-4">
      <p style={{fontSize:'9px',fontFamily:'JetBrains Mono,monospace',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'10px'}}>

          style={{left:`${pct}%`}}>

            style={{boxShadow:'0 0 0 2px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.35)'}}>

/* ══════════════════════════════════════════════
   HISTORY CHART (SVG area)
══════════════════════════════════════════════ */
function HistoryChart({data}){
  if(!data||data.length<2) return null;
  const W=600,H=130,PAD=32;
  const vals=[...data].reverse().map(d=>Number(d.delta_e)||0);
  const mn=0,mx=Math.max(...vals,700);
  const sy=v=>H-PAD-((v-mn)/(mx-mn))*(H-PAD*1.5);
  const pts=vals.map((v,i)=>({x:PAD+(i/(vals.length-1))*(W-PAD*2),y:sy(v)}));
  const path=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area=path+` L${pts[pts.length-1].x},${H-PAD} L${pts[0].x},${H-PAD} Z`;
  const thresholds=[{v:45,color:'#16a34a',l:'45'},{v:150,color:'#d97706',l:'150'},{v:600,color:'#ea580c',l:'600'}]
    .filter(t=>sy(t.v)>8&&sy(t.v)<H-PAD);
  return(
    <div className="bg-white rounded-2xl border border-amber-100 p-5 shadow-sm overflow-hidden">
      <p style={{fontSize:'9px',fontFamily:'JetBrains Mono,monospace',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'14px'}}>
        ICUMSA — Histórico Visual
      </p>
      <div style={{overflowX:'auto'}}>
        <svg style={{width:'100%',height:H,minWidth:280}} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMinYMid meet">
          <defs>
            <linearGradient id="hGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="#d97706" stopOpacity=".22"/>
              <stop offset="100%" stopColor="#d97706" stopOpacity=".02"/>
            </linearGradient>
          </defs>
          {[.25,.5,.75].map(t=>(
            <line key={t} x1={PAD} y1={PAD+(H-PAD*1.5)*t} x2={W-PAD} y2={PAD+(H-PAD*1.5)*t} stroke="#f3f4f6" strokeWidth="1"/>
          ))}
          {thresholds.map(({v,color,l})=>(
            <g key={v}>
              <line x1={PAD} y1={sy(v)} x2={W-PAD} y2={sy(v)} stroke={color} strokeWidth="1" strokeDasharray="3 3" opacity=".55"/>
              <text x={PAD+4} y={sy(v)-4} fontSize="9" fill={color} fontFamily="JetBrains Mono,monospace">{l}</text>
            </g>
          ))}
          <path d={area} fill="url(#hGrad)"/>
          <path d={path} fill="none" stroke="#d97706" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          {pts.map((p,i)=>(
            <circle key={i} cx={p.x} cy={p.y} r={i===pts.length-1?4:2}
              fill={i===pts.length-1?"#d97706":"#fbbf24"}
              stroke="white" strokeWidth={i===pts.length-1?2:1}/>
          ))}
          <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="#e5e7eb" strokeWidth="1"/>
        </svg>
      </div>
    </div>
  );
}

        <button onClick={()=>{onTutorial();onClose()}}
          className="w-full flex items-center gap-2 px-4 py-2.5 rounded-xl hover:bg-white/5 transition-all">
          <span style={{fontSize:'13px'}}>🎓</span>
          <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'10px',letterSpacing:'0.1em',textTransform:'uppercase',color:'#57534e'}}>Tutorial</span>
        </button>
        <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'8px',letterSpacing:'0.12em',color:'#292524',textAlign:'center',marginTop:'12px'}}>
          SISTEMA DE VISÃO DE COR
        </p>
      </div>
    </div>
  );
  return(
    <>
      <aside className="hidden md:flex flex-col w-64 h-screen fixed left-0 top-0 z-30 overflow-y-auto">{content}</aside>
      {open&&(
        <>
          <div className="fixed inset-0 bg-black/60 z-40 md:hidden fade-in" onClick={onClose}/>
          <aside className="fixed left-0 top-0 bottom-0 w-64 z-50 md:hidden sidebar-slide flex flex-col overflow-y-auto">
            <button onClick={onClose} className="absolute top-4 right-4 text-stone-500 hover:text-white w-5 h-5 z-10"><Icon.X/></button>
            {content}
          </aside>
        </>
      )}
    </>
  );
}

/* ══════════════════════════════════════════════
   TUTORIAL
══════════════════════════════════════════════ */
function Tutorial({onClose}){
  const [step,setStep]=useState(0);
  const s=TUTORIAL_STEPS[step];
  const last=step===TUTORIAL_STEPS.length-1;
  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center tutorial-overlay fade-in">
      <div className="bg-stone-950 rounded-3xl shadow-2xl w-full max-w-sm mx-4 scale-in overflow-hidden border border-amber-900/25">
        <div className="h-0.5 bg-stone-800">
          <div className="h-0.5 bg-amber-500 transition-all duration-500"
            style={{width:`${((step+1)/TUTORIAL_STEPS.length)*100}%`}}/>
        </div>
        <div className="p-8">
          <div className="flex justify-between items-center mb-6">
            <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'rgba(217,119,6,.5)',letterSpacing:'0.15em',textTransform:'uppercase'}}>
              {step+1}/{TUTORIAL_STEPS.length}
            </span>
            <button onClick={onClose} className="text-stone-600 hover:text-stone-300 w-4 h-4"><Icon.X/></button>
          </div>
          <div className="text-4xl text-center mb-5">{s.icon}</div>
          <h2 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'20px',fontWeight:700,color:'#fef3c7',textAlign:'center',marginBottom:'12px',fontStyle:'italic'}}>{s.title}</h2>
          <p className="text-sm text-stone-400 text-center leading-relaxed whitespace-pre-line">{s.body}</p>
          <div className="flex justify-center gap-1.5 mt-6 mb-6">
            {TUTORIAL_STEPS.map((_,i)=>(
              <button key={i} onClick={()=>setStep(i)}
                className={`h-1 rounded-full transition-all ${i===step?'w-6 bg-amber-500':'w-2 bg-stone-700'}`}/>
            ))}
          </div>
          <div className="flex gap-2">
            {step>0&&(
              <button onClick={()=>setStep(s=>s-1)}
                className="flex-1 py-3 rounded-xl border border-stone-700 text-stone-400 font-medium text-sm hover:bg-stone-900 transition-all">
                ← Anterior
              </button>
            )}
            <button onClick={()=>last?onClose():setStep(s=>s+1)}
              className="flex-1 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm transition-all">
              {last?'Começar':'Próximo →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════
   UPLOAD ZONE
══════════════════════════════════════════════ */
function UploadZone({onFile,loading,id}){
  const [drag,setDrag]=useState(false);
  const ref=useRef();
  const handle=useCallback(f=>{if(f)onFile(f)},[onFile]);
  return(
    <div id={id}
      onClick={()=>!loading&&ref.current.click()}
      onDragOver={e=>{e.preventDefault();setDrag(true)}}
      onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);handle(e.dataTransfer.files[0])}}
      className={`border-2 border-dashed rounded-2xl p-8 text-center cursor-pointer transition-all duration-200
        ${drag?'drop-active':'border-amber-200 bg-white hover:border-amber-400 hover:bg-amber-50/30'}
        ${loading?'pointer-events-none':''}`}>
      <input ref={ref} type="file" accept="image/*,video/*" onChange={e=>handle(e.target.files[0])}/>
      {loading?(
        <div className="flex flex-col items-center gap-3">
          <svg className="spinner w-10 h-10 text-amber-600" fill="none" viewBox="0 0 24 24">
            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
          <p className="font-semibold text-amber-800">Analisando amostra...</p>
          <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#d97706'}}>Extração LAB · Classificação ICUMSA</p>
        </div>
      ):(
        <>
          <div className="w-14 h-14 bg-amber-50 border-2 border-amber-200 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-500">
            <div className="w-7 h-7"><Icon.Upload/></div>
          </div>
          <p className="font-semibold text-stone-700">Enviar amostra de açúcar</p>
          <p className="text-stone-400 text-sm mt-1.5">Arraste ou clique · foto ou vídeo</p>
          <div className="flex justify-center gap-1.5 mt-4 flex-wrap">
            {['JPG','PNG','TIFF','MP4','AVI','MOV'].map(f=>(
              <span key={f} style={{fontFamily:'JetBrains Mono,monospace',fontSize:'10px'}} className="px-2 py-0.5 bg-stone-100 text-stone-500 rounded-md">{f}</span>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   METRIC TILE
══════════════════════════════════════════════ */
function Tile({label,value,sub,big,tooltip,accent}){
  const [show,setShow]=useState(false);
  return(
    <div className={`relative bg-white rounded-xl p-4 border shadow-sm tile-hover ${accent?'border-amber-200 bg-amber-50/40':'border-gray-100'}`}
      onMouseEnter={()=>tooltip&&setShow(true)} onMouseLeave={()=>setShow(false)}>
      <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'6px'}}>{label}</p>
      <p style={{fontFamily:'JetBrains Mono,monospace',fontWeight:700,color:'#1c1917',fontSize:big?'22px':'15px'}}>{value}</p>
      {sub&&<p className="text-xs text-gray-400 mt-0.5">{sub}</p>}
      {show&&tooltip&&(
        <div className="absolute bottom-full left-0 mb-2 w-56 bg-stone-950 text-stone-300 text-xs rounded-xl p-3 shadow-2xl z-20 fade-in border border-stone-800">
          {tooltip}
          <div className="absolute bottom-[-5px] left-4 w-2.5 h-2.5 bg-stone-950 rotate-45 border-r border-b border-stone-800"/>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   PAGE: ANÁLISE
══════════════════════════════════════════════ */
function PageAnalise(){
  const [resultado,setResultado]=useState(null);
  const [preview,setPreview]=useState(null);
  const [loading,setLoading]=useState(false);
  const [erro,setErro]=useState(null);

  const handleFile=async(file)=>{
    setErro(null);setResultado(null);
    setPreview({url:URL.createObjectURL(file),isVideo:file.type.startsWith('video')});
    setLoading(true);
    const form=new FormData();
    form.append('file',file);
    try{
      const r=await fetch(`${API}/analisar`,{method:'POST',body:form});
      if(!r.ok){const e=await r.json();throw new Error(e.detail??'Erro desconhecido');}
      setResultado(await r.json());
    }catch(e){setErro(e.message);}
    finally{setLoading(false);}
  };

  return(
    <div className="space-y-6">
      <div>
        <h1 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'30px',fontWeight:700,fontStyle:'italic',color:'#1c1917'}}>
          Análise de Amostra
        </h1>
        <p className="text-stone-400 text-sm mt-1">Classificação automática · padrão ICUMSA internacional</p>
      </div>

      {/* Upload row: zona + preview lado a lado, compacto */}
      <div className="grid sm:grid-cols-2 gap-4">
        <UploadZone onFile={handleFile} loading={loading} id="upload-zone"/>
        {preview?(
          <div className="rounded-2xl overflow-hidden border-2 border-amber-200 shadow-sm fade-up h-full min-h-[160px]">
            {preview.isVideo
              ?<video src={preview.url} controls className="w-full h-full object-cover"/>
              :<img src={preview.url} alt="Preview" className="w-full h-full object-cover" style={{maxHeight:'240px'}}/>
            }
          </div>
        ):(
          <div className="rounded-2xl border-2 border-dashed border-amber-100 bg-amber-50/10 flex items-center justify-center min-h-[160px]">
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#d6d3d1',letterSpacing:'0.08em'}}>preview aqui</p>
          </div>
        )}
      </div>

      {erro&&(
        <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-600 text-sm fade-up">
          ⚠ {erro}
        </div>
      )}

      {/* Resultado: full width, respira */}
      {resultado
        ?<ResultCard res={resultado} id="result-card"/>
        :(
          <div className="rounded-2xl border-2 border-dashed border-amber-100 flex items-center justify-center py-14 text-center bg-amber-50/10">
            <div>
              <div className="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3 text-amber-300">
                <div className="w-6 h-6"><Icon.Chart/></div>
              </div>
              <p className="font-medium text-stone-400 text-sm">Aguardando amostra</p>
              <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'10px',color:'#d6d3d1',marginTop:'4px'}}>resultado aparecerá aqui após análise</p>
            </div>
          </div>
        )
      }

      {/* Reference table */}
      <div className="bg-white rounded-2xl border border-amber-100 overflow-hidden shadow-sm">
        <div className="bg-stone-900 px-5 py-3.5 flex items-center gap-2">
          <span style={{fontFamily:'Playfair Display,Georgia,serif',color:'white',fontWeight:600,fontSize:'14px',fontStyle:'italic'}}>
            Tabela ICUMSA Internacional
          </span>
          <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'10px',color:'#57534e',marginLeft:'auto'}}>GS — ICUMSA 2011</span>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="bg-stone-50 border-b border-stone-100">
                {['Classe','Norma','Faixa ICUMSA','Pureza','Descrição'].map(h=>(
                  <th key={h} className="px-4 py-3 text-left"
                    style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase'}}>
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {[
                ['Açúcar Branco','GS1/2/3-1','≤ 45 IU','≥ 99.7%','Refinado premium'],
                ['Açúcar Branco Padrão','GS2/3-2','46–150 IU','≥ 99.5%','Refinado padrão'],
                ['VHP / Demerara','GS2-37','151–600 IU','≥ 98%','Parcialmente refinado'],
                ['Mascavo / Bruto','GS2-13','> 600 IU','≥ 97.5%','Não refinado'],
              ].map(([c,n,f,p,d],i)=>(
                <tr key={i} className={`border-t border-gray-100 ${i%2?'bg-stone-50/30':''}`}>
                  <td className="px-4 py-3 font-semibold text-stone-800">{c}</td>
                  <td className="px-4 py-3 text-amber-600" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px'}}>{n}</td>
                  <td className="px-4 py-3 font-bold text-stone-700" style={{fontFamily:'JetBrains Mono,monospace'}}>{f}</td>
                  <td className="px-4 py-3 text-stone-500">{p}</td>
                  <td className="px-4 py-3 text-stone-400">{d}</td>
                </tr>
              ))}

/* ══════════════════════════════════════════════
   PAGE: HISTÓRICO
══════════════════════════════════════════════ */
function PageHistorico(){
  const [data,setData]=useState([]);
  const [loading,setLoading]=useState(true);

  const load=async()=>{
    setLoading(true);
    try{const r=await fetch(`${API}/historico`);setData(await r.json());}
    catch{}finally{setLoading(false);}
  };

  const limpar=async()=>{
    if(!confirm('Limpar todo o histórico?')) return;
    await fetch(`${API}/historico`,{method:'DELETE'});
    setData([]);
  };

  const exportCSV=()=>{
    const cols=['id','timestamp','L','a','b','delta_e','status','created_at'];
    const rows=data.map(r=>cols.map(c=>r[c]??'').join(','));
    const blob=new Blob([cols.join(',')+'\n'+rows.join('\n')],{type:'text/csv'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='historico_icumsa.csv';a.click();
  };

  useEffect(()=>{load();},[]);

  const avg=data.length?(data.reduce((s,d)=>s+(Number(d.delta_e)||0),0)/data.length).toFixed(1):null;
  const best=data.length?Math.min(...data.map(d=>Number(d.delta_e)||9999)).toFixed(0):null;

  return(
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <div>
          <h1 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'30px',fontWeight:700,fontStyle:'italic',color:'#1c1917'}}>
            Histórico
          </h1>
          <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'12px',color:'#9ca3af',marginTop:'4px'}}>
            {data.length} análise(s) registrada(s)
          </p>
        </div>
        <div className="flex gap-2">
          {data.length>0&&<>
            <button onClick={exportCSV}
              className="flex items-center gap-2 px-4 py-2 bg-white border border-amber-200 text-amber-700 rounded-xl text-sm font-medium hover:bg-amber-50 transition-all">
              <span className="w-4 h-4"><Icon.Download/></span>CSV
            </button>
            <button onClick={limpar}
              className="flex items-center gap-2 px-4 py-2 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm font-medium hover:bg-red-100 transition-all">
              <span className="w-4 h-4"><Icon.Trash/></span>Limpar
            </button>
          </>}
          <button onClick={load}
            className="px-4 py-2 bg-amber-700 text-white rounded-xl text-sm font-semibold hover:bg-amber-600 transition-all">
            Atualizar
          </button>
        </div>
      </div>

      {data.length>0&&(
        <div className="grid grid-cols-3 gap-3 fade-up">
          {[
            {label:'Total análises',value:data.length,color:'#1c1917'},
            {label:'Média ICUMSA',value:`${avg} IU`,color:'#b45309'},
            {label:'Melhor leitura',value:`${best} IU`,color:'#047857'},
          ].map(({label,value,color})=>(
            <div key={label} className="bg-white rounded-xl border border-amber-100 p-4 shadow-sm">
              <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'6px'}}>{label}</p>
              <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'22px',fontWeight:700,color}}>{value}</p>
            </div>
          ))}
        </div>
      )}

      {loading?(
        <div className="flex justify-center py-16">
          <svg className="spinner w-8 h-8 text-amber-600" fill="none" viewBox="0 0 24 24">
            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
          </svg>
        </div>
      ):data.length===0?(
        <div className="bg-white rounded-2xl border border-amber-100 p-16 text-center">
          <p className="text-amber-200 text-5xl mb-4">📋</p>
          <p className="font-semibold text-stone-600">Nenhuma análise registrada</p>
          <p className="text-stone-400 text-sm mt-1">Envie amostras na aba Análise</p>
        </div>
      ):(
        <>
          <HistoryChart data={data}/>
          <div className="bg-white rounded-2xl border border-amber-100 overflow-hidden shadow-sm fade-up">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-stone-900">
                    {['#','Horário','Classe','ICUMSA','L*','a*','b*'].map(h=>(
                      <th key={h} className="px-4 py-3 text-left"
                        style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#57534e',letterSpacing:'0.12em',textTransform:'uppercase'}}>
                        {h}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {data.map((r,i)=>{
                    const s=icumsaStyle(r.delta_e??9999);
                    return(
                      <tr key={i} className={`border-t border-gray-100 hover:bg-amber-50/20 transition-colors ${i%2?'bg-stone-50/30':''}`}>
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#d1d5db'}}>{r.id}</td>
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#9ca3af'}}>{fmtTime(r.created_at)}</td>
                        <td className="px-4 py-3">
                          <span className={`text-xs px-2 py-1 rounded-full font-semibold ${s.pill}`}
                            style={{fontFamily:'JetBrains Mono,monospace',fontSize:'10px'}}>
                            {r.status}
                          </span>
                        </td>
                        <td className="px-4 py-3 font-bold text-stone-700" style={{fontFamily:'JetBrains Mono,monospace'}}>{fmt(r.delta_e,0)}</td>
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'12px',color:'#78716c'}}>{fmt(r.L,2)}</td>
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'12px',color:'#78716c'}}>{fmt(r.a,3)}</td>
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'12px',color:'#78716c'}}>{fmt(r.b,2)}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   PAGE: MONITORAMENTO
══════════════════════════════════════════════ */
function PageMonitoramento(){
  const [file,setFile]=useState(null);
  const [sampleRate,setSampleRate]=useState(5);
  const [loading,setLoading]=useState(false);
  const [data,setData]=useState(null);
  const [playIdx,setPlayIdx]=useState(0);
  const [playing,setPlaying]=useState(false);
  const [playSpeed,setPlaySpeed]=useState(500);
  const timerRef=useRef(null);
  const videoRef=useRef(null);
  const [videoReady,setVideoReady]=useState(false);
  const [fileUrl,setFileUrl]=useState(null);

  const handleFile=async(f)=>{
    setFile(f);setData(null);setPlayIdx(0);setPlaying(false);setVideoReady(false);
    if(fileUrl)URL.revokeObjectURL(fileUrl);
    setFileUrl(URL.createObjectURL(f));
  };

  const analisar=async()=>{
    if(!file)return;
    setLoading(true);setData(null);setPlayIdx(0);setPlaying(false);
    const form=new FormData();
    form.append('file',file);
    try{
      const r=await fetch(`${API}/monitoramento/video?sample_rate=${sampleRate}`,{method:'POST',body:form});
      if(!r.ok){const e=await r.json();throw new Error(e.detail??'Erro');}
      const d=await r.json();
      setData(d);
    }catch(e){alert('Erro: '+e.message);}
    finally{setLoading(false);}
  };

  const togglePlay=()=>{
    if(!data)return;
    setPlaying(p=>{
      if(!p){
        // start
        timerRef.current=setInterval(()=>{
          setPlayIdx(i=>{
            const next=i+1;
            if(next>=data.resultados.length){clearInterval(timerRef.current);setPlaying(false);return i;}
            return next;
          });
        },playSpeed);
        return true;
      } else {
        clearInterval(timerRef.current);
        return false;
      }
    });
  };

  useEffect(()=>{
    return()=>{clearInterval(timerRef.current);};
  },[]);

  useEffect(()=>{
    const v=videoRef.current;
    if(!v||!videoReady||!data?.resultados[playIdx])return;
    const cur=data.resultados[playIdx];
    if(v.duration)v.currentTime=(cur.frame_idx/cur.total_frames_video)*v.duration;
  },[playIdx,videoReady]);

  const cur=data?.resultados[playIdx];
  const mudancas=data?.resultados.filter(r=>r.mudanca_detectada)||[];

  return(
    <div className="space-y-5">
      <div>
        <h1 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'30px',fontWeight:700,fontStyle:'italic',color:'#1c1917'}}>Monitoramento</h1>
        <p className="text-stone-400 text-sm mt-1">Simula feed de câmera · detecta mudança de tipo de açúcar</p>
      </div>

      {/* Config */}
      <div className="bg-white rounded-2xl border border-amber-100 p-5 space-y-4">
        <div className="grid sm:grid-cols-3 gap-4 items-end">
          <div className="sm:col-span-2">
            <label className="block text-xs font-semibold text-stone-500 mb-1.5">Vídeo para monitoramento</label>
            <div
              onClick={()=>document.getElementById('mon-input').click()}
              className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-all
                ${file?'border-amber-400 bg-amber-50':'border-amber-200 bg-white hover:border-amber-400 hover:bg-amber-50/30'}`}>
              <input id="mon-input" type="file" accept="video/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
              {file?(
                <p className="font-semibold text-amber-800">{file.name} <span className="text-stone-400 text-xs ml-2">({(file.size/1024/1024).toFixed(1)} MB)</span></p>
              ):(
                <p className="text-stone-400 text-sm">Clique para selecionar vídeo (MP4, AVI, MOV)</p>
              )}
            </div>
          </div>
          <div>
            <label className="block text-xs font-semibold text-stone-500 mb-1.5">Analisar 1 a cada N frames</label>
            <input type="number" min={1} max={60} value={sampleRate} onChange={e=>setSampleRate(Number(e.target.value))}
              className="w-full border border-stone-200 rounded-xl px-3 py-2.5 text-sm font-mono focus:outline-none focus:border-amber-400"/>
          </div>
        </div>
        <button onClick={analisar} disabled={!file||loading}
          className={`w-full py-3 rounded-xl font-semibold text-sm transition-all
            ${!file||loading?'bg-stone-100 text-stone-400 cursor-not-allowed':'bg-amber-700 hover:bg-amber-600 text-white'}`}>
          {loading?(
            <span className="flex items-center justify-center gap-2">
              <svg className="spinner w-4 h-4" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
              Analisando frames...
            </span>
          ):'▶ Analisar Vídeo'}
        </button>
      </div>

      {/* Video Preview */}
      {fileUrl&&(
        <div className="bg-black rounded-2xl overflow-hidden border border-stone-800">
          <div className="relative" style={{aspectRatio:'16/9'}}>
            <video ref={videoRef} src={fileUrl}
              className="w-full h-full object-contain"
              onLoadedMetadata={()=>setVideoReady(true)}
              muted/>
            {loading&&(
              <div className="absolute inset-0 bg-black/75 flex flex-col items-center justify-center gap-3">
                <svg className="spinner w-10 h-10 text-amber-400" fill="none" viewBox="0 0 24 24">
                  <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                  <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
                </svg>
                <p className="text-amber-300 font-bold text-sm">Analisando frames...</p>
              </div>
            )}
            {!loading&&cur?.mudanca_detectada&&(
              <div className="absolute top-3 inset-x-3 flex items-center gap-3 bg-red-600/90 backdrop-blur-sm rounded-xl px-4 py-3 shadow-lg">
                <span className="text-2xl">⚠️</span>
                <div>
                  <p className="font-bold text-white text-sm">MUDANÇA DETECTADA</p>
                  <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px'}} className="text-red-200">{cur.classe_anterior} → {cur.classe}</p>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* Playback */}
      {data&&(
        <>
          {/* Summary */}
          <div className="grid grid-cols-3 gap-3">
            {[
              {label:'Frames analisados',value:data.frames_analisados,sub:`de ${data.total_frames_video} total`},
              {label:'Mudanças detectadas',value:data.total_mudancas,sub:'de tipo de açúcar',accent:data.total_mudancas>0},
              {label:'Taxa de amostragem',value:`1/${data.sample_rate}`,sub:'frames'},
            ].map(({label,value,sub,accent})=>(
              <div key={label} className={`bg-white rounded-xl border p-4 shadow-sm ${accent?'border-red-300 bg-red-50':'border-amber-100'}`}>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'6px'}}>{label}</p>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'22px',fontWeight:700,color:accent?'#dc2626':'#1c1917'}}>{value}</p>
                {sub&&<p className="text-xs text-stone-400 mt-0.5">{sub}</p>}
              </div>
            ))}
          </div>

          {/* Player */}
          <div className="bg-white rounded-2xl border border-amber-100 p-5">
            <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
              <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase'}}>
                Reprodução — Frame {playIdx+1}/{data.resultados.length}
              </p>
              <div className="flex items-center gap-2">
                <label className="text-xs text-stone-400">Velocidade (ms)</label>
                <input type="range" min={100} max={2000} step={100} value={playSpeed}
                  onChange={e=>{setPlaySpeed(Number(e.target.value));if(playing){clearInterval(timerRef.current);timerRef.current=setInterval(()=>{setPlayIdx(i=>{const next=i+1;if(next>=data.resultados.length){clearInterval(timerRef.current);setPlaying(false);return i;}return next;});},Number(e.target.value));}}}
                  className="w-24 accent-amber-600"/>
                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#9ca3af'}}>{playSpeed}ms</span>
                <button onClick={()=>setPlayIdx(0)} className="px-3 py-1.5 text-xs bg-stone-100 hover:bg-stone-200 rounded-lg font-mono transition-all">⏮</button>
                <button onClick={togglePlay}
                  className={`px-4 py-1.5 text-xs rounded-lg font-semibold transition-all ${playing?'bg-red-600 hover:bg-red-500 text-white':'bg-amber-700 hover:bg-amber-600 text-white'}`}>
                  {playing?'⏸ Pausar':'▶ Play'}
                </button>
              </div>
            </div>

            {/* Timeline slider */}
            <input type="range" min={0} max={data.resultados.length-1} value={playIdx}
              onChange={e=>{setPlayIdx(Number(e.target.value));}}
              className="w-full accent-amber-600 mb-4"/>

            {/* Current frame result */}
            {cur&&(()=>{
              const s=icumsaStyle(cur.icumsa_estimado);
              return(
                <div className={`rounded-xl border-2 p-4 ${s.border} ${s.bg}`}>
                  {cur.mudanca_detectada&&(
                    <div className="mb-3 bg-red-50 border border-red-300 rounded-lg px-4 py-2.5 flex items-center gap-2">
                      <span className="text-red-500 text-lg">⚠️</span>
                      <div>
                        <p className="font-bold text-red-700 text-sm">MUDANÇA DETECTADA</p>
                        <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#9ca3af'}}>
                          {cur.classe_anterior} → {cur.classe}
                        </p>
                      </div>
                    </div>
                  )}
                  <div className="flex items-center justify-between flex-wrap gap-3">
                    <div>
                      <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.1em',textTransform:'uppercase'}}>
                        Frame {cur.frame_idx} de {cur.total_frames_video}
                      </p>
                      <h3 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'20px',fontWeight:700,fontStyle:'italic'}} className={s.text}>
                        {cur.classe}
                      </h3>
                    </div>
                    <div className="flex gap-3 flex-wrap">
                      <Tile label="ICUMSA" value={`${Math.round(cur.icumsa_estimado)} IU`}/>
                      <Tile label="Score" value={cur.score_brancura?.toFixed(1)}/>
                      <Tile label="L*" value={cur.L?.toFixed(2)}/>
                      <Tile label="Confiança" value={cur.confianca}/>
                      <div className="flex items-center">
                        <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'10px'}}
                          className={`px-2 py-1 rounded-full ${cur.fonte==='ML'?'bg-blue-100 text-blue-700':'bg-stone-100 text-stone-600'}`}>
                          {cur.fonte==='ML'?'🤖 ML':'📏 Regras'}
                        </span>
                      </div>
                    </div>
                  </div>
                  <ICUMSASpectrum value={cur.icumsa_estimado}/>
                </div>
              );
            })()}
          </div>

          {/* Change log */}
          {mudancas.length>0&&(
            <div className="bg-white rounded-2xl border border-red-200 overflow-hidden shadow-sm">
              <div className="bg-red-700 px-5 py-3 flex items-center gap-2">
                <span className="text-white text-sm font-bold">⚠️ Log de Mudanças ({mudancas.length})</span>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-stone-50 border-b border-stone-100">
                      {['Frame','De','Para','ICUMSA'].map(h=>(
                        <th key={h} className="px-4 py-3 text-left"
                          style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase'}}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {mudancas.map((m,i)=>(
                      <tr key={i} className="border-t border-gray-100">
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px'}}>{m.frame_idx}</td>
                        <td className="px-4 py-3 text-stone-500 text-xs">{m.classe_anterior}</td>
                        <td className="px-4 py-3 font-semibold text-red-700 text-xs">{m.classe}</td>
                        <td className="px-4 py-3" style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px'}}>{Math.round(m.icumsa_estimado)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════
   PAGE: TREINO
══════════════════════════════════════════════ */
function PageTreino(){
  const [stats,setStats]=useState(null);
  const [amostras,setAmostras]=useState([]);
  const [loadingStats,setLoadingStats]=useState(true);
  const [treinando,setTreinando]=useState(false);
  const [resultado,setResultado]=useState(null);

  // labeling state
  const [labelFile,setLabelFile]=useState(null);
  const [labelPreview,setLabelPreview]=useState(null);
  const [labelAnalise,setLabelAnalise]=useState(null);
  const [labelClasse,setLabelClasse]=useState('');
  const [salvando,setSalvando]=useState(false);

  const loadStats=async()=>{
    setLoadingStats(true);
    try{
      const [sr,ar]=await Promise.all([
        fetch(`${API}/treino/stats`).then(r=>r.json()),
        fetch(`${API}/treino/amostras`).then(r=>r.json()),
      ]);
      setStats(sr);setAmostras(ar);
      if(!labelClasse&&sr.classes_disponiveis?.length) setLabelClasse(sr.classes_disponiveis[0]);
    }catch{}finally{setLoadingStats(false);}
  };

  useEffect(()=>{loadStats();},[]);

  const handleLabelFile=async(f)=>{
    setLabelFile(f);setLabelAnalise(null);
    setLabelPreview(URL.createObjectURL(f));
    const form=new FormData();form.append('file',f);
    try{
      const r=await fetch(`${API}/analisar`,{method:'POST',body:form});
      if(r.ok) setLabelAnalise(await r.json());
    }catch{}
  };

  const salvarAmostra=async()=>{
    if(!labelAnalise||!labelClasse)return;
    setSalvando(true);
    try{
      const payload={
        L:labelAnalise.L_star??labelAnalise.L,
        a:labelAnalise.a,
        b:labelAnalise.b_star??labelAnalise.b,
        score_brancura:labelAnalise.score_brancura,
        R_medio:labelAnalise.R_medio??0,
        G_medio:labelAnalise.G_medio??0,
        B_medio:labelAnalise.B_medio??0,
        classe:labelClasse,
      };
      const r=await fetch(`${API}/treino/amostra`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      if(!r.ok) throw new Error('Falha ao salvar');
      await loadStats();
      setLabelFile(null);setLabelPreview(null);setLabelAnalise(null);
    }catch(e){alert('Erro: '+e.message);}
    finally{setSalvando(false);}
  };

  const treinar=async()=>{
    setTreinando(true);setResultado(null);
    try{
      const r=await fetch(`${API}/treino/treinar`,{method:'POST'});
      if(!r.ok){const e=await r.json();throw new Error(e.detail);}
      setResultado(await r.json());
      await loadStats();
    }catch(e){alert('Erro: '+e.message);}
    finally{setTreinando(false);}
  };

  const toggleModelo=async(ativo)=>{
    await fetch(`${API}/treino/modelo/ativar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ativo})});
    await loadStats();
  };

  const deletarAmostra=async(id)=>{
    await fetch(`${API}/treino/amostra/${id}`,{method:'DELETE'});
    await loadStats();
  };

  const limparTudo=async()=>{
    if(!confirm('Limpar todas as amostras?'))return;
    await fetch(`${API}/treino/amostras`,{method:'DELETE'});
    await loadStats();
  };

  const podeTreinar=stats&&stats.total>=10&&Object.keys(stats.por_classe||{}).length>=2;

  return(
    <div className="space-y-5">
      <div>
        <h1 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'30px',fontWeight:700,fontStyle:'italic',color:'#1c1917'}}>Treino do Classificador</h1>
        <p className="text-stone-400 text-sm mt-1">Rotule amostras · treine modelo ML · substitui regras fixas</p>
      </div>

      {/* Status cards */}
      {stats&&(
        <div className="grid sm:grid-cols-3 gap-3">
          <div className="bg-white rounded-xl border border-amber-100 p-4 shadow-sm">
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'6px'}}>Total amostras</p>
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'28px',fontWeight:700,color:'#1c1917'}}>{stats.total}</p>
            <p className="text-xs text-stone-400 mt-1">mínimo 10 de ≥2 classes</p>
          </div>
          <div className="bg-white rounded-xl border border-amber-100 p-4 shadow-sm">
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'6px'}}>Modelo treinado</p>
            <p style={{fontSize:'24px'}}>{stats.modelo_treinado?'✅':'❌'}</p>
            {stats.modelo_treinado&&(
              <button onClick={()=>toggleModelo(!stats.modelo_ativo)}
                className={`mt-2 text-xs px-3 py-1 rounded-full font-semibold border transition-all
                  ${stats.modelo_ativo?'bg-blue-100 text-blue-700 border-blue-200':'bg-stone-100 text-stone-500 border-stone-200'}`}>
                {stats.modelo_ativo?'🤖 ML Ativo — desativar':'📏 Regras — ativar ML'}
              </button>
            )}
          </div>
          <div className="bg-white rounded-xl border border-amber-100 p-4 shadow-sm">
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'8px'}}>Por classe</p>
            {Object.entries(stats.por_classe||{}).map(([cls,cnt])=>(
              <div key={cls} className="flex justify-between items-center mb-1.5">
                <span className="text-xs text-stone-600 truncate max-w-[70%]">{cls.replace('Acucar ','')}</span>
                <span style={{fontFamily:'JetBrains Mono,monospace',fontSize:'12px',fontWeight:700,color:'#b45309'}}>{cnt}</span>
              </div>
            ))}
            {!Object.keys(stats.por_classe||{}).length&&<p className="text-xs text-stone-400">Nenhuma amostra ainda</p>}
          </div>
        </div>
      )}

      {resultado&&(
        <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-5 py-4 fade-up">
          <p className="font-bold text-emerald-700">✅ Modelo treinado com sucesso!</p>
          {resultado.acuracia_cv!=null&&(
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'14px',color:'#065f46',marginTop:'4px'}}>
              Acurácia CV: <strong>{resultado.acuracia_cv}%</strong>
            </p>
          )}
          <p className="text-sm text-emerald-600 mt-1">Modelo ML ativado automaticamente para todas as análises.</p>
        </div>
      )}

      {/* Rotulagem */}
      <div className="bg-white rounded-2xl border border-amber-100 p-5">
        <h2 className="font-semibold text-stone-800 mb-4" style={{fontFamily:'Playfair Display,Georgia,serif',fontStyle:'italic'}}>Adicionar Amostra Rotulada</h2>
        <div className="grid sm:grid-cols-2 gap-5">
          <div>
            <div
              onClick={()=>document.getElementById('label-input').click()}
              className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-all mb-3
                ${labelFile?'border-amber-400 bg-amber-50':'border-amber-200 hover:border-amber-400 hover:bg-amber-50/30'}`}>
              <input id="label-input" type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleLabelFile(e.target.files[0])}/>
              {labelPreview?(
                <img src={labelPreview} alt="preview" className="w-full max-h-40 object-cover rounded-lg"/>
              ):(
                <p className="text-stone-400 text-sm py-4">Clique para selecionar foto da amostra</p>
              )}
            </div>
          </div>
          <div className="space-y-3">
            {labelAnalise&&(
              <div className={`rounded-xl border-2 p-3 ${icumsaStyle(labelAnalise.icumsa_estimado).border} ${icumsaStyle(labelAnalise.icumsa_estimado).bg}`}>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:'4px'}}>
                  Classificação automática
                </p>
                <p className="font-bold text-stone-800">{labelAnalise.classe}</p>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#9ca3af'}}>
                  ICUMSA ~{Math.round(labelAnalise.icumsa_estimado)} · Score {labelAnalise.score_brancura?.toFixed(1)} · {labelAnalise.fonte==='ML'?'🤖 ML':'📏 Regras'}
                </p>
              </div>
            )}
            {stats?.classes_disponiveis&&(
              <div>
                <label className="block text-xs font-semibold text-stone-500 mb-1.5">Classe correta</label>
                <select value={labelClasse} onChange={e=>setLabelClasse(e.target.value)}
                  className="w-full border border-stone-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400">
                  {stats.classes_disponiveis.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            )}
            <button onClick={salvarAmostra} disabled={!labelAnalise||!labelClasse||salvando}
              className={`w-full py-2.5 rounded-xl font-semibold text-sm transition-all
                ${!labelAnalise||!labelClasse||salvando?'bg-stone-100 text-stone-400 cursor-not-allowed':'bg-amber-700 hover:bg-amber-600 text-white'}`}>
              {salvando?'Salvando...':'✅ Confirmar e Salvar'}
            </button>
          </div>
        </div>
      </div>

      {/* Treinar */}
      <div className="bg-white rounded-2xl border border-amber-100 p-5">
        <div className="flex items-center justify-between flex-wrap gap-3">
          <div>
            <h2 className="font-semibold text-stone-800" style={{fontFamily:'Playfair Display,Georgia,serif',fontStyle:'italic'}}>Treinar Modelo</h2>
            {!podeTreinar&&(

/* ══════════════════════════════════════════════
   PAGE: CALIBRAÇÃO
══════════════════════════════════════════════ */
function PageCalibracao(){
  const [status,setStatus]=useState(null);
  const [file,setFile]=useState(null);
  const [preview,setPreview]=useState(null);
  const [Lalvo,setLalvo]=useState(96.0);
  const [aalvo,setAalvo]=useState(0.0);
  const [balvo,setBalvo]=useState(2.0);
  const [calibrando,setCalibrando]=useState(false);
  const [resultado,setResultado]=useState(null);

  const loadStatus=async()=>{
    try{const r=await fetch(`${API}/calibrar/status`);setStatus(await r.json());}catch{}
  };

  useEffect(()=>{loadStatus();},[]);

  const calibrar=async()=>{
    if(!file)return;
    setCalibrando(true);setResultado(null);
    const form=new FormData();form.append('file',file);
    try{
      const r=await fetch(`${API}/calibrar?L_alvo=${Lalvo}&a_alvo=${aalvo}&b_alvo=${balvo}`,{method:'POST',body:form});
      if(!r.ok){const e=await r.json();throw new Error(e.detail);}
      setResultado(await r.json());
      await loadStatus();
    }catch(e){alert('Erro: '+e.message);}
    finally{setCalibrando(false);}
  };

  const resetar=async()=>{
    if(!confirm('Resetar calibração?'))return;
    await fetch(`${API}/calibrar`,{method:'DELETE'});
    setResultado(null);await loadStatus();
  };

  return(
    <div className="space-y-5 max-w-2xl">
      <div>
        <h1 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'30px',fontWeight:700,fontStyle:'italic',color:'#1c1917'}}>Calibração de Iluminação</h1>
        <p className="text-stone-400 text-sm mt-1">Corrige desvios sistemáticos de luz para melhorar precisão</p>
      </div>

      {/* Status atual */}
      {status&&(
        <div className={`rounded-xl border px-5 py-4 flex items-center justify-between flex-wrap gap-3
          ${status.calibrado?'bg-emerald-50 border-emerald-200':'bg-stone-50 border-stone-200'}`}>
          <div>
            <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:'4px'}}>
              Status atual
            </p>
            <p className={`font-semibold text-sm ${status.calibrado?'text-emerald-700':'text-stone-500'}`}>{status.status}</p>
            {status.calibrado&&(
              <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#9ca3af',marginTop:'4px'}}>
                ΔL{status.offset_L>0?'+':''}{status.offset_L} · Δa{status.offset_a>0?'+':''}{status.offset_a} · Δb{status.offset_b>0?'+':''}{status.offset_b}
              </p>
            )}
          </div>
          {status.calibrado&&(
            <button onClick={resetar} className="text-xs text-red-600 hover:text-red-500 font-medium px-3 py-1.5 border border-red-200 rounded-lg">Resetar</button>
          )}
        </div>
      )}

      <div className="bg-white rounded-2xl border border-amber-100 p-5 space-y-5">
        <div>
          <h2 className="font-semibold text-stone-700 mb-1" style={{fontFamily:'Playfair Display,Georgia,serif',fontStyle:'italic'}}>Como funciona</h2>
          <p className="text-sm text-stone-400 leading-relaxed">
            Fotografe um material branco de referência (papel sulfite, ColorChecker) sob a mesma iluminação da linha de produção.
            Informe os valores L* a* b* reais do material. O sistema calcula os offsets e os aplica em todas as análises futuras.
          </p>
        </div>

        {/* Upload referência */}
        <div>
          <label className="block text-xs font-semibold text-stone-500 mb-1.5">Foto do material de referência branco</label>
          <div
            onClick={()=>document.getElementById('cal-input').click()}
            className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-all
              ${file?'border-amber-400 bg-amber-50':'border-amber-200 hover:border-amber-400 hover:bg-amber-50/30'}`}>
            <input id="cal-input" type="file" accept="image/*" style={{display:'none'}} onChange={e=>{setFile(e.target.files[0]);setPreview(URL.createObjectURL(e.target.files[0]));}}/>
            {preview?(
              <img src={preview} alt="referência" className="max-h-36 mx-auto rounded-lg object-cover"/>
            ):(
              <p className="text-stone-400 text-sm py-6">Clique para selecionar foto de referência branca</p>
            )}
          </div>
        </div>

        {/* Valores alvo */}
        <div>
          <label className="block text-xs font-semibold text-stone-500 mb-3">Valores reais do material de referência (CIE LAB)</label>
          <div className="grid grid-cols-3 gap-3">
            {[
              {label:'L* alvo',val:Lalvo,set:setLalvo,min:0,max:100,step:0.5,hint:'Papel branco ≈ 96'},
              {label:'a* alvo',val:aalvo,set:setAalvo,min:-50,max:50,step:0.1,hint:'Neutro ≈ 0'},
              {label:'b* alvo',val:balvo,set:setBalvo,min:-50,max:50,step:0.1,hint:'Branco ≈ 2'},
            ].map(({label,val,set,min,max,step,hint})=>(
              <div key={label}>
                <label className="block text-xs text-stone-400 mb-1">{label}</label>
                <input type="number" min={min} max={max} step={step} value={val} onChange={e=>set(Number(e.target.value))}
                  className="w-full border border-stone-200 rounded-xl px-3 py-2 text-sm font-mono focus:outline-none focus:border-amber-400"/>
                <p className="text-xs text-stone-300 mt-1">{hint}</p>
              </div>
            ))}
          </div>
        </div>

        <button onClick={calibrar} disabled={!file||calibrando}
          className={`w-full py-3 rounded-xl font-semibold text-sm transition-all
            ${!file||calibrando?'bg-stone-100 text-stone-400 cursor-not-allowed':'bg-amber-700 hover:bg-amber-600 text-white'}`}>
          {calibrando?'Calibrando...':'🎯 Calibrar agora'}
        </button>
      </div>

      {resultado&&(
        <div className="bg-emerald-50 border border-emerald-200 rounded-xl px-5 py-4 fade-up space-y-2">
          <p className="font-bold text-emerald-700">✅ Calibração aplicada!</p>
          <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'11px',color:'#065f46'}}>{resultado.status}</p>
          <div className="grid grid-cols-3 gap-3 mt-2">
            {[
              {label:'ΔL*',val:resultado.offset_L},
              {label:'Δa*',val:resultado.offset_a},
              {label:'Δb*',val:resultado.offset_b},
            ].map(({label,val})=>(
              <div key={label} className="bg-white rounded-lg border border-emerald-200 p-3 text-center">
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'9px',color:'#9ca3af',textTransform:'uppercase'}}>{label}</p>
                <p style={{fontFamily:'JetBrains Mono,monospace',fontSize:'18px',fontWeight:700,color:val>0?'#16a34a':val<0?'#dc2626':'#9ca3af'}}>
                  {val>0?'+':''}{val}
                </p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PageDemo({setPage}){
  const [file,setFile]=useState(null);
  const [preview,setPreview]=useState(null);
  const [drag,setDrag]=useState(false);
  const ref=useRef();

  const handleFile=(f)=>{
    if(!f) return;
    setFile(f);
    setPreview({url:URL.createObjectURL(f),isVideo:f.type.startsWith('video')});
  };

  const handleUseDemo=()=>{
    if(!file) return;
    if(file.type.startsWith('video')) setPage('monitoramento');
    else setPage('analise');
  };

  return(
    <div className="space-y-8 relative overflow-hidden">
      {/* Background decorative elements */}
      <div className="absolute inset-0 pointer-events-none">
        <div className="absolute top-10 right-10 w-32 h-32 bg-amber-100/20 rounded-full blur-3xl animate-pulse"/>
        <div className="absolute bottom-20 left-10 w-24 h-24 bg-cana-200/15 rounded-full blur-2xl animate-pulse" style={{animationDelay:'1s'}}/>
      </div>

      <div className="relative z-10">
        <div className="text-center mb-8">
          <h1 style={{fontFamily:'Playfair Display,Georgia,serif',fontSize:'36px',fontWeight:700,fontStyle:'italic',color:'#1c1917',lineHeight:1.1}}>
            Demo de Amostra
          </h1>
          <p className="text-stone-500 text-lg mt-2 max-w-md mx-auto">
            Teste o sistema com arquivos de exemplo — imagens ou vídeos de açúcar

        </div>

        {/* Upload Area */}
        <div className="max-w-2xl mx-auto mb-8">
          <div
            onClick={()=>ref.current.click()}
            onDragOver={(e)=>{e.preventDefault();setDrag(true)}}
            onDragLeave={()=>setDrag(false)}
            onDrop={(e)=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}
            className={`relative border-3 border-dashed rounded-3xl p-12 text-center cursor-pointer transition-all duration-300 transform hover:scale-[1.02] ${
              drag ? 'border-cana-500 bg-cana-50/50 scale-105' : 'border-amber-300 bg-gradient-to-br from-amber-50/30 to-cana-50/20'
            } ${file ? 'pointer-events-none opacity-50' : ''}`}
            style={{
              backgroundImage: drag ? 'none' : 'radial-gradient(circle at 20% 80%, rgba(251,191,36,0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(180,83,9,0.05) 0%, transparent 50%)',
              boxShadow: drag ? '0 0 40px rgba(251,191,36,0.3)' : '0 4px 20px rgba(0,0,0,0.05)'

                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={1.5} strokeLinecap="round" strokeLinejoin="round" className="w-10 h-10">
                    <path d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082M19.8 15l-1.57.393A9.065 9.065 0 0112 15a9.065 9.065 0 00-6.23-.693L5 14.5m14.8.5l.36 1.44c.463 1.853-.663 3.707-2.48 4.328a15.053 15.053 0 01-9.36 0c-1.817-.621-2.943-2.475-2.48-4.328L5 14.5"/>
                  </svg>
                </div>
                <p className="font-bold text-stone-800 text-xl mb-2" style={{fontFamily:'Playfair Display,Georgia,serif',fontStyle:'italic'}}>

                <p className="text-stone-600 text-base mb-4">
                  ou clique para selecionar — imagens ou vídeos de açúcar
                </p>
                <div className="flex justify-center gap-2 flex-wrap">
                  {['JPG','PNG','MP4','AVI'].map(f=>(

            {file && !preview && (

                  style={{fontFamily:'Playfair Display,Georgia,serif',fontStyle:'italic',fontSize:'18px'}}
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6">

              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
